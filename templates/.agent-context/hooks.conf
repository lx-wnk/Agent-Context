# Agent-Context hooks configuration. Project-owned — edit freely; never overwritten on update.
# Read by .agent-context/hooks/*.sh. The hook SCRIPTS are shared (auto-updated); all behavior
# and project-specific commands live HERE.
#
# This file is committed, so anyone who can push to the repo controls it. HOOKS_ENABLED, TEST_CMD
# and FORMAT_CMD are therefore IGNORED here: the hooks read them only from the gitignored,
# per-developer .agent-context/hooks.local.conf, because TEST_CMD and FORMAT_CMD are executed.
# Values below for those three keys are suggestions to copy. hooks.local.conf may also override
# any other key in this file.
#
# The secret-write guard is on by default and does not depend on HOOKS_ENABLED. The format, test
# gate and scope hooks are opt-in: put HOOKS_ENABLED=1 plus your FORMAT_CMD / TEST_CMD into
# .agent-context/hooks.local.conf. The hooks must also be registered in .claude/settings.json
# (setup does this; see README).

# Master switch for format, test gate and scope check (hooks.local.conf only). 0 = off (default).
HOOKS_ENABLED=0

# --- PreToolUse: block writes to secret files ---
# On by default, independent of HOOKS_ENABLED. PROTECT_SECRETS=0 here or in hooks.local.conf
# switches it off. A missing or unreadable conf falls back to on with the built-in globs (same list as below).
PROTECT_SECRETS=1
# Space-separated globs matched against the basename and full path of the target file and of its
# symlink target. Writes only (reads are not guarded); *.example, *.dist and *.sample are always allowed.
PROTECTED_GLOBS=".env .env.* *.pem *.key id_rsa id_rsa.* *.secret secrets.*"

# --- PostToolUse: auto-format edited files ---
FORMAT_ON_EDIT=1
# Command to format a single file (hooks.local.conf only). Use {} for the path, or leave it off to
# have the path appended. Files outside the project root are never formatted.
# Examples: "npx prettier --write {}"  |  "gofmt -w"  |  "php-cs-fixer fix"
FORMAT_CMD=""

# --- Stop: test gate ---
# off | warn (run tests, report failures, still stop) | block (on failure, send the agent back once;
# the follow-up stop is not re-tested, so this is not "until green")
STOP_GATE="warn"
# Command that returns 0 when the suite is green (hooks.local.conf only). Examples: "npm test" | "composer test"
TEST_CMD=""

# --- SubagentStop: scope check ---
# off | warn (report out-of-scope writes) | block (force continue)
SUBAGENT_SCOPE="off"
# Space-separated globs, relative to the project root, a subagent may write. Writes outside the
# project always count as violations. Empty = no enforcement.
# Example: "src/* tests/* *.md"
ALLOWED_SUBAGENT_PATHS=""
