# Project-owned configuration for the .agent-context/bin/ tooling. Edit freely.
#
# Three consumers read this file, and each reads only the keys it names:
#   check-token-budget.sh  MAX_EFFECTIVE_LINES, MAX_EFFECTIVE_LINES_HARD, INCLUDE_FILES
#   check-map-budget.sh    MAP_*
#   memory-prune.sh        MEMORY_TTL_DEFAULTS
#
# Values are read as data, never executed — a shell command written here does not run.
#
# Naming convention for NEW keys: prefix with the consuming concern (MAP_, MEMORY_, …) so a
# fourth consumer cannot collide with a name that already means something else. The
# token-budget keys predate the convention and keep their names.

# --- Always-on context budget (read by .agent-context/bin/check-token-budget.sh) ---
# Run the audit manually any time:
#   bash .agent-context/bin/check-token-budget.sh
#
# Lines are a proxy for tokens — a deterministic guardrail against the baseline
# (the files loaded on every session) bloating over time, not an exact tokenizer.

# Soft cap: the TARGET for the always-on closure. Over this only WARNS (the run still passes) —
# so a real project filling its layers isn't blocked at line 201. Keep the baseline near this.
MAX_EFFECTIVE_LINES=200

# Hard cap: over this FAILS the gate (exit 1). The buffer above the soft target absorbs
# legitimately-filled project layers while still stopping real bloat. When this line is absent
# the hard cap defaults to 250. Set it equal to MAX_EFFECTIVE_LINES to make the soft cap fail.
MAX_EFFECTIVE_LINES_HARD=250

# The gate measures what actually loads: it walks the @-imports from .claude/CLAUDE.md (and
# ./CLAUDE.md if present), each resolved relative to the importing file. A file nobody imports
# is not counted by the walk; an import that points at no file is reported as a warning.
#
# INCLUDE_FILES is OPTIONAL and ADDITIVE: list only files an agent reads at every session start
# WITHOUT an @-import. They are counted on top of the walked closure, and each run prints
# "note: <file> is counted from INCLUDE_FILES but not @-imported" so a stale entry stays visible.
# An entry the walk already reaches is deduplicated silently. Removing the key leaves the walk
# alone to define the set. The two below are the Session Routine reads in layer0.
# One path per line is fine; whitespace-separated also works.
INCLUDE_FILES="
.agent-context/memory/lessons.md
.agent-context/memory/preferences.md
"

# --- Discovery map caps (read by .agent-context/bin/check-map-budget.sh) ---
# The discovery map is pulled ON-DEMAND, never @-included. These caps keep the
# top index tiny so even a 10k-file repo costs only a small index + 1–2 node notes.
# A coarse repo that exceeds MAP_MAX_TOTAL_BYTES must split hierarchically into
# memory/<area>/map.json (see the discovery-map skill).

# Path to the top-level map relative to the project root.
MAP_FILE=".agent-context/map.json"

# Whole-file byte ceiling for the top index. Deliberately small.
MAP_MAX_TOTAL_BYTES=16384

# Max number of nodes in the top index (counted as "id": occurrences).
MAP_MAX_NODES=60

# Max bytes of a single node line EXCLUDING its globs array — a guard against prose bloat in the
# label, not against legitimate glob lists. Globs are never truncated to fit this; the total-byte
# cap above bounds overall size (globs included). 400 leaves ample room for a descriptive label.
MAP_MAX_NODE_LINE_BYTES=400

# --- Memory TTL defaults (read by .agent-context/bin/memory-prune.sh) ---
# Default TTL per memory file, applied ONLY to dated entries that carry no ttl: of their
# own. An explicit ttl: on the entry always wins, including ttl:infinite. Keys are file
# basenames; `*` is a catch-all. Values: <N>d or infinite — no leading zero (09d is rejected).
#
# Keys listed here override the shared table in memory-prune.sh per key — files you do not
# list keep their shared default. Uncomment and edit to tune a single file.
#
# Keys match by basename at ANY depth: `lessons.md=90d` also governs memory/<domain>/lessons.md.
# To give a domain copy its own TTL, give it its own filename.
#
# people.md and user.md ship `infinite` below. A project with a GDPR storage-limitation duty
# for team data (Art. 5(1)(e)) may want a finite TTL for these two instead.

# MEMORY_TTL_DEFAULTS="
# lessons.md=30d
# preferences.md=infinite
# people.md=infinite
# user.md=infinite
# *=180d
# "
